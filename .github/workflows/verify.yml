name: Verify research revision

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MPLBACKEND: Agg
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt
      - name: Exercise rejection and lineage checks
        run: python -m unittest discover -s tests -v
      - name: Reproduce and independently verify the released results
        run: python src/check_reproduction.py
